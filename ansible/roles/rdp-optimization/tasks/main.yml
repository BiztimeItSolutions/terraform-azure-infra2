---
# RDP Optimization Role
# Configures RDP settings for better performance and usability

- name: Optimize RDP Performance
  block:
    - name: Increase RDP performance registry settings
      win_regedit:
        path: "{{ item.path }}"
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: "{{ item.type }}"
      loop:
        - path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          name: 'MaxConnectionTime'
          data: 0
          type: dword
        
        - path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          name: 'MaxDisconnectionTime'
          data: 0
          type: dword
        
        - path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          name: 'MaxIdleTime'
          data: 0
          type: dword
        
        - path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          name: 'fSingleSessionPerUser'
          data: 0
          type: dword
      ignore_errors: yes

- name: Configure Network Optimization
  block:
    - name: Enable Network Level Authentication
      win_regedit:
        path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
        name: 'SecurityLayer'
        data: 2
        type: dword
      ignore_errors: yes

    - name: Set RDP encoding
      win_regedit:
        path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
        name: 'fInheritMaxSessionTime'
        data: 1
        type: dword
      ignore_errors: yes

- name: Configure RDP Security
  block:
    - name: Require secure RDP connections
      win_regedit:
        path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
        name: 'MinimumEncryptionLevel'
        data: 3
        type: dword
      ignore_errors: yes

- name: Enable RDP Listeners
  block:
    - name: Enable RDP Listener
      win_service:
        name: TermService
        state: started
        start_mode: auto

    - name: Enable Remote Desktop Firewall Exception
      win_firewall_rule:
        name: "Remote Desktop - User Mode (TCP-In)"
        enabled: yes
        state: present

    - name: Enable Remote Desktop Firewall Exception UDP
      win_firewall_rule:
        name: "Remote Desktop - User Mode (UDP-In)"
        enabled: yes
        state: present

- name: Create RDP diagnostic script
  block:
    - name: Create RDP test script
      win_shell: |
        $scriptContent = @"
        # RDP Diagnostic Script
        Write-Host "=== RDP Configuration Report ===" -ForegroundColor Green
        
        # Check RDP Service
        $service = Get-Service TermService
        Write-Host "RDP Service Status: $($service.Status)"
        
        # Check RDP Port
        $rdpPort = Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name PortNumber
        Write-Host "RDP Port: $($rdpPort.PortNumber)"
        
        # Check Network Level Authentication
        $nla = Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name SecurityLayer
        Write-Host "Network Level Authentication: $($nla.SecurityLayer)"
        
        # Check Firewall Rules
        $fwRules = Get-NetFirewallRule -DisplayName "Remote Desktop*" | Where-Object {$_.Enabled -eq 'True'}
        Write-Host "Firewall Rules Enabled: $($fwRules.Count)"
        
        # List active connections
        $netstat = netstat -ano | findstr ":3389"
        Write-Host "Active RDP Connections:"
        Write-Host $netstat
        
        Write-Host "=== Report Complete ===" -ForegroundColor Green
        "@
        
        $scriptContent | Out-File -FilePath 'C:\Windows\System32\rdp-diagnostic.ps1' -Encoding UTF8
        Write-Output "RDP diagnostic script created"
      ignore_errors: yes

- name: Configure Display and Keyboard
  block:
    - name: Set clipboard sharing
      win_regedit:
        path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
        name: 'fDisableClip'
        data: 0
        type: dword
      ignore_errors: yes

    - name: Enable drive redirection
      win_regedit:
        path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
        name: 'fDisableCdm'
        data: 0
        type: dword
      ignore_errors: yes

- name: Summary
  debug:
    msg: |
      RDP Optimization Summary:
      - Service: TermService (Remote Desktop Services)
      - Port: 3389 (default)
      - Network Level Authentication: Enabled
      - Security: TLS 1.2 required
      - Clipboard Sharing: Enabled
      - Drive Redirection: Enabled
      
      Diagnostic Script: C:\Windows\System32\rdp-diagnostic.ps1
      
      To run diagnostic:
      PowerShell -ExecutionPolicy Bypass -File C:\Windows\System32\rdp-diagnostic.ps1
