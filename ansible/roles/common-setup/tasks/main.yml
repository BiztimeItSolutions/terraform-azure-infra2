---
# Common setup tasks for all Windows VMs

- name: Update Windows
  block:
    - name: Install Windows updates
      win_updates:
        category_names:
          - CriticalUpdates
          - SecurityUpdates
          - Updates
        state: installed
      register: win_updates
      ignore_errors: yes

    - name: Reboot if required
      win_reboot:
        msg: "Windows updates installed, rebooting..."
      when: win_updates.reboot_required

- name: Install required software packages
  block:
    - name: Install Chocolatey package manager
      win_chocolatey:
        name: chocolatey
        state: present
      ignore_errors: yes

    - name: Install 7zip for archive extraction
      win_chocolatey:
        name: 7zip
        state: present
      ignore_errors: yes

    - name: Install Git
      win_chocolatey:
        name: git
        state: present
      ignore_errors: yes

- name: Configure PowerShell
  block:
    - name: Set PowerShell Execution Policy
      win_shell: Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force

    - name: Enable WinRM
      win_shell: |
        Enable-PSRemoting -Force
        Set-Item WSMan:\localhost\MaxEnvelopeSizeKb 4096

- name: Prepare directories
  block:
    - name: Create installation directories
      win_file:
        path: "{{ item }}"
        state: directory
      loop:
        - "C:\\Fortify"
        - "C:\\Tools"
        - "C:\\Applications"
        - "C:\\Users\\{{ ansible_user }}\\Desktop\\SourceCode"

    - name: Set directory permissions
      win_acl:
        path: "{{ item }}"
        user: "{{ ansible_user }}"
        rights:
          - Modify
          - Write
          - Read
        type: allow
        state: present
      loop:
        - "C:\\Fortify"
        - "C:\\Tools"
        - "C:\\Applications"

- name: Configure RDP settings
  block:
    - name: Enable RDP
      win_regedit:
        path: HKLM:\System\CurrentControlSet\Control\Terminal Server
        name: fDenyTSConnections
        data: 0
        type: dword

    - name: Enable RDP firewall rules
      win_firewall_rule:
        name: "{{ item }}"
        enabled: yes
        state: present
      loop:
        - "Remote Desktop - User Mode (TCP-In)"
        - "Remote Desktop - User Mode (UDP-In)"

- name: Display completion
  debug:
    msg: "Common setup completed successfully"
