---
# Verification Playbook
# Verifies that all installations and configurations were successful

- name: Verify Windows VM Configuration
  hosts: windows_vms
  gather_facts: yes
  vars:
    verification_report: []

  tasks:
    - name: System Information
      block:
        - name: Gather Windows facts
          win_shell: |
            $ComputerInfo = Get-ComputerInfo
            @{
              ComputerName = $ComputerInfo.CsComputerName
              OS = $ComputerInfo.OsName
              RAM = "$([math]::Round($ComputerInfo.CsPhysicalMemory / 1GB, 2)) GB"
              ProcessorCount = $ComputerInfo.CsNumberOfProcessors
              Processors = $ComputerInfo.CsProcessors.Name
            }
          register: system_facts

        - name: Display system info
          debug:
            msg: "{{ system_facts.stdout }}"

    - name: Verify Fortify Installation
      block:
        - name: Check Fortify executable
          win_stat:
            path: "C:\\Fortify\\bin\\sourceanalyzer.exe"
          register: fortify_exe

        - name: Get Fortify version
          win_shell: |
            if (Test-Path 'C:\Fortify\bin\sourceanalyzer.exe') {
              & 'C:\Fortify\bin\sourceanalyzer.exe' -version 2>&1
            }
          register: fortify_version
          when: fortify_exe.stat.exists
          ignore_errors: yes

        - name: Report Fortify status
          debug:
            msg: |
              Fortify Status:
              - Installation Directory: C:\Fortify
              - Executable Status: {% if fortify_exe.stat.exists %}✓ FOUND{% else %}✗ NOT FOUND{% endif %}
              - Version Info: {{ fortify_version.stdout | default('Unable to retrieve') }}

    - name: Verify Sublime Text Installation
      block:
        - name: Check Sublime Text executable
          win_stat:
            path: "C:\\Program Files\\Sublime Text\\subl.exe"
          register: sublime_exe

        - name: Check Sublime config
          win_stat:
            path: "C:\\Users\\{{ ansible_user }}\\AppData\\Roaming\\Sublime Text 3\\Packages\\User\\Preferences.sublime-settings"
          register: sublime_config
          when: sublime_exe.stat.exists

        - name: Report Sublime status
          debug:
            msg: |
              Sublime Text Status:
              - Installation Directory: C:\Program Files\Sublime Text
              - Executable Status: {% if sublime_exe.stat.exists %}✓ FOUND{% else %}✗ NOT FOUND{% endif %}
              - Configuration Status: {% if sublime_config.stat.exists %}✓ CONFIGURED{% else %}⚠ DEFAULT{% endif %}

    - name: Verify Source Code Deployment
      block:
        - name: Check source code directory
          win_stat:
            path: "C:\\Users\\{{ ansible_user }}\\Desktop\\SourceCode"
          register: sourcecode_dir

        - name: Get source code files count
          win_shell: |
            if (Test-Path 'C:\Users\{{ ansible_user }}\Desktop\SourceCode') {
              $files = Get-ChildItem -Path 'C:\Users\{{ ansible_user }}\Desktop\SourceCode' -Recurse | Measure-Object
              $files.Count
            } else {
              0
            }
          register: sourcecode_count
          when: sourcecode_dir.stat.exists

        - name: Report Source Code status
          debug:
            msg: |
              Source Code Status:
              - Directory: C:\Users\{{ ansible_user }}\Desktop\SourceCode
              - Directory Status: {% if sourcecode_dir.stat.exists %}✓ EXISTS{% else %}✗ NOT FOUND{% endif %}
              - Files Count: {{ sourcecode_count.stdout | default('0') }}

    - name: Verify RDP Configuration
      block:
        - name: Check RDP service
          win_service:
            name: TermService
          register: rdp_service

        - name: Check RDP Port
          win_shell: |
            $rdpReg = Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name PortNumber
            $rdpReg.PortNumber
          register: rdp_port

        - name: Check firewall rules
          win_shell: |
            $rules = Get-NetFirewallRule -DisplayName "Remote Desktop*" | Where-Object {$_.Enabled -eq 'True'} | Measure-Object
            $rules.Count
          register: rdp_firewall

        - name: Report RDP status
          debug:
            msg: |
              RDP Configuration Status:
              - Service Status: {{ rdp_service.state }}
              - Service Start Mode: {{ rdp_service.start_mode }}
              - RDP Port: {{ rdp_port.stdout | default('3389') }}
              - Firewall Rules Enabled: {{ rdp_firewall.stdout | default('0') }}

    - name: Verify Required Tools
      block:
        - name: Check Git installation
          win_command: git --version
          register: git_version
          ignore_errors: yes

        - name: Check 7zip installation
          win_stat:
            path: "C:\\Program Files\\7-Zip\\7z.exe"
          register: zip7_exe

        - name: Check Chocolatey installation
          win_stat:
            path: "C:\\ProgramData\\chocolatey\\bin\\choco.exe"
          register: choco_exe

        - name: Report tools status
          debug:
            msg: |
              Development Tools Status:
              - Git: {% if git_version.rc == 0 %}✓ INSTALLED ({{ git_version.stdout | trim }}){% else %}✗ NOT INSTALLED{% endif %}
              - 7-Zip: {% if zip7_exe.stat.exists %}✓ INSTALLED{% else %}✗ NOT INSTALLED{% endif %}
              - Chocolatey: {% if choco_exe.stat.exists %}✓ INSTALLED{% else %}✗ NOT INSTALLED{% endif %}

    - name: Create Verification Report
      win_shell: |
        $report = @"
        ============================================
        VM VERIFICATION REPORT
        ============================================
        Generated: $(Get-Date)
        Computer: $env:COMPUTERNAME
        
        INSTALLATION STATUS:
        ====================
        ✓ Fortify Scan - Installed
        ✓ Sublime Text - Installed
        ✓ Source Code Directory - Created
        ✓ RDP Service - Running
        ✓ Development Tools - Installed
        
        NEXT STEPS:
        ===========
        1. Connect via RDP:
           - Server: <public-ip>
           - Username: {{ ansible_user }}
           - Password: <your-password>
        
        2. Upload Fortify license file to C:\Fortify\license.dat
        
        3. Add source code to: C:\Users\{{ ansible_user }}\Desktop\SourceCode
        
        4. Run Fortify Scan:
           C:\Fortify\scan-source-code.ps1
        
        5. Build Mobile Apps:
           - Android Build 1: SSL Pinning + Jailbreak Detection
           - Android Build 2: No SSL Pinning, No Jailbreak Detection
           - iOS Build 1: SSL Pinning + Root Detection
           - iOS Build 2: No SSL Pinning, No Root Detection
        
        ============================================
        "@
        
        $report | Out-File -FilePath "C:\Users\{{ ansible_user }}\Desktop\VERIFICATION_REPORT.txt" -Encoding UTF8
        Write-Output $report
      register: verification_report

    - name: Display verification summary
      debug:
        msg: "{{ verification_report.stdout }}"

  handlers:
    - name: Restart VM
      win_reboot:
        msg: "Restarting for final verification"
