[defaults]
# Ansible Configuration File for Windows/Azure Environment

# Host key checking
host_key_checking = False

# Inventory
inventory = inventory/hosts.ini

# Python interpreter
interpreter_python = auto

# Output formatting
force_color = True
stdout_callback = yaml

# SSH settings (if needed)
ssh_args = -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no

# Parallelism
forks = 5

# Timeout settings
timeout = 300
connect_timeout = 10

# Become settings
[privilege_escalation]
become_method = runas
become_user = System

# Windows-specific settings
[winrm]
timeout = 300
read_timeout = 30
operation_timeout = 120
certificate_validation = ignore
# certificate_validation = validate
# ca_trust_path = /etc/ssl/certs

# Defaults
remote_user = azureuser
remote_tmp = C:\Windows\Temp\ansible
local_tmp = ~/.ansible/tmp

# Logging
log_path = ansible.log
display_skipped_hosts = False

# Callback plugins
#callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer
